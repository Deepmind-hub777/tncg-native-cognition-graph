<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3ead7">
  <title>千字文 · 学习</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/hanzi-writer.min.js" defer></script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="page-head">
    <p class="eyebrow" id="page-eyebrow">古典文字 · 第 1 頁</p>
    <h1>千字文</h1>
    <p class="review-badge" id="review-badge">部分內容待校訂</p>
    <p><a class="listen-link" href="./site/index.html">試聽模式 · 逐句聽讀</a></p>
  </header>
  <nav class="page-navigation" aria-label="課程頁面">
    <button type="button" id="page-first" aria-label="第一頁">第一頁</button>
    <button type="button" id="page-prev" aria-label="上一頁">上一頁</button>
    <label for="page-select">頁次</label><select id="page-select" aria-label="選擇頁次"></select>
    <span id="page-indicator" aria-live="polite">第 1 / 63 頁</span>
    <button type="button" id="page-next" aria-label="下一頁">下一頁</button>
    <button type="button" id="page-last" aria-label="最後一頁">最後一頁</button>
  </nav>
  <nav class="lesson-navigation" aria-label="本頁四組文字"><div id="page-groups" role="group" aria-label="選擇本頁文字組"></div></nav>
  <main id="lesson" aria-busy="true">
    <section class="lesson-section text-section" data-lesson-section="text" aria-labelledby="text-title">
      <h2 id="text-title">繁體原文</h2>
      <p class="traditional-text" id="traditional-text" aria-live="polite"></p>
    </section>
    <section class="lesson-section pinyin-section" data-lesson-section="pinyin" aria-labelledby="pinyin-title">
      <h2 id="pinyin-title">拼音</h2>
      <div class="pinyin-list" id="pinyin-list"></div>
      <p class="status" id="pinyin-status"></p>
    </section>
    <section class="lesson-section" data-lesson-section="audio" aria-labelledby="audio-title">
      <h2 id="audio-title">普通話語音</h2>
      <div class="button-row">
        <button type="button" id="play-slow">普通話語音</button>
      </div>
      <div class="char-audio" id="char-audio"></div>
      <p class="status" id="audio-status" role="status" aria-live="polite">點擊按鈕播放</p>
      <audio id="audio-player" preload="none"></audio>
    </section>
    <section class="lesson-section meaning-section" data-lesson-section="meaning" aria-labelledby="meaning-title">
      <h2 id="meaning-title">簡體中文解釋</h2>
      <p id="meaning-reading" class="meaning-reading"></p>
      <p class="status" id="meaning-status"></p>
    </section>
    <section class="lesson-section english-section" data-lesson-section="english" aria-labelledby="english-title">
      <h2 id="english-title">A short note</h2>
      <p id="english-note"></p>
      <p class="status" id="english-status"></p>
    </section>
    <section class="lesson-section illustration-section" data-lesson-section="illustration" aria-labelledby="illustration-title">
      <h2 id="illustration-title">意境插畫</h2>
      <figure><img id="illustration" src="assets/illustrations/qzw-001.png" alt="深蓝天幕下，暖金色大地与远山相接" loading="lazy"><figcaption id="illustration-caption">玄天覆下，黄土承载万物。</figcaption></figure>
    </section>
    <section class="lesson-section writing-section" data-lesson-section="writing" aria-labelledby="writing-title">
      <h2 id="writing-title">筆順與描紅</h2>
      <p class="section-hint">按筆順觀察，再用手指描寫或自由書寫。</p>
      <div class="writing-toolbar">
        <button type="button" id="mode-trace" aria-pressed="true">描紅</button>
        <button type="button" id="mode-free" aria-pressed="false">自由書寫</button>
        <button type="button" id="clear-writing">清除</button>
      </div>
      <div class="writing-grid" id="writing-grid"></div>
      <p class="status" id="writing-status" role="status" aria-live="polite">標準筆順資料待校訂</p>
    </section>
    <section class="lesson-section quiz-section" data-lesson-section="quiz" aria-labelledby="quiz-title">
      <h2 id="quiz-title">聽音辨字</h2>
      <p>聽一聽，選出你聽到的字。</p>
      <div class="quiz-controls"><span id="quiz-progress" aria-live="polite">第 1 / 10 題</span><button type="button" id="quiz-play">播放題目</button><span>積分 <strong id="score">0</strong></span><button type="button" id="quiz-next" disabled>下一題</button></div>
      <div class="quiz-options" id="quiz-options"></div>
      <p class="status" id="quiz-feedback" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer><span>每天認識一組文字</span></footer>
</body>
</html>
